<div class="bg-white dark:bg-orange-700 p-6 shadow-lg">
  <h2 class="text-2xl font-semibold mb-6 text-gray-800 dark:text-white text-center">Pokémon Blacklist</h2>

  <div class="mb-6">
    <label for="pokemonId" class="block text-sm font-medium text-gray-700 dark:text-gray-300">ID del Pokémon a agregar:</label>
    <input
      id="pokemonId"
      type="number"
      [(ngModel)]="pokemonIdToAdd"
      placeholder="Ingresa el ID del Pokémon"
      class="mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full transition duration-200 ease-in-out"
    />
    <button
      (click)="addPokemon()"
      class="mt-4 w-full p-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-200 ease-in-out"
    >
      Agregar Pokémon
    </button>
  </div>
</div>


<div class="p-4">

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <div class="pb-4 pt-1 pl-1 bg-white dark:bg-gray-900">
        <label for="table-search" class="sr-only">Buscar</label>
        <div class="relative mt-1">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                </svg>
            </div>
            <input type="text" id="table-search" [(ngModel)]="searchQuery" placeholder="Buscar..." class="block pt-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        </div>
    </div>
    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
      
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
        <tr>
          <th scope="col" class="px-20 py-3">ID</th>
          <th scope="col" class="px-6 py-3 pl-28">Nombre</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pokemon of filteredBlacklist()" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
          <td class="px-20 py-4">{{ pokemon.pokemon_id }}</td>
          <td class="px-6 py-4 pl-28">{{ pokemon.pokemon_name }}</td>
          <td class="px-6 py-4">
            <button
              (click)="removePokemon(pokemon.id_blacklist)"
              class="font-medium text-red-600 dark:text-red-500 hover:underline"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
